[package]
name = "rust-imsai-emulator"
version = "0.1.0"
edition = "2021"
# Two binaries (imsai-cli, imsai-gui). Without this, a bare `cargo run`
# errors with "could not determine which binary to run". Default to the
# terminal CLI; use `cargo run --bin imsai-gui` for the raylib front panel.
default-run = "imsai-cli"

[lib]
name = "rust_imsai_emulator"
path = "src/lib.rs"

[[bin]]
name = "imsai-cli"
path = "src/main.rs"

# Front panel GUI (raylib) - optional, requires raylib C library
[[bin]]
name = "imsai-gui"
path = "src/bin/panel.rs"

[dependencies]
crossterm = "0.29.0"
intel8080 = { git = "https://github.com/andrewthecodertx/rust-intel8080-emulator" }
raylib = "5.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
