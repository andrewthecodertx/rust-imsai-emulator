[package]
name = "rust-imsai-emulator"
version = "0.9.3"
edition = "2021"

[lib]
name = "rust_imsai_emulator"
path = "src/lib.rs"
doctest = false

# Front panel GUI (raylib). raylib is an optional dep gated behind the `gui`
# feature, which is a default feature, so `cargo build`/`cargo run` build the
# GUI. Use `--no-default-features` for a fast headless library-only build/test
# (no raylib C library needed).
[[bin]]
name = "imsai-gui"
path = "src/bin/panel.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:raylib"]

[dependencies]
intel8080 = { git = "https://github.com/andrewthecodertx/rust-intel8080-emulator", rev = "aaea08fdeba555df4387e6944bdfa48946cf490f" }
raylib = { version = "5.5.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
