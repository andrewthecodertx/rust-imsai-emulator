name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            strip: strip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            strip: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            strip: strip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs '"ADD_CMAKE_TO_PATH=System"'

      - name: Build CLI
        run: cargo build --release --bin imsai-cli --target ${{ matrix.target }}

      - name: Build GUI
        run: cargo build --release --bin imsai-gui --features gui --target ${{ matrix.target }}

      - name: Strip binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/imsai-cli
          strip target/${{ matrix.target }}/release/imsai-gui

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          mkdir -p ../../../staging
          cp imsai-cli imsai-gui ../../../staging/
          cp -r ${{ github.workspace }}/programs ${{ github.workspace }}/binaries ${{ github.workspace }}/disks ../../../staging/
          cd ../../../staging
          tar czf ${{ github.workspace }}/imsai-8080-emulator-${{ matrix.target }}.tar.gz imsai-cli imsai-gui programs binaries disks

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target\${{ matrix.target }}\release
          New-Item -ItemType Directory -Force -Path ..\..\..\staging
          Copy-Item imsai-cli.exe, imsai-gui.exe ..\..\..\staging\
          Copy-Item -Recurse ${{ github.workspace }}\programs, ${{ github.workspace }}\binaries, ${{ github.workspace }}\disks ..\..\..\staging\
          Compress-Archive -Path ..\..\..\staging\imsai-cli.exe, ..\..\..\staging\imsai-gui.exe, ..\..\..\staging\programs, ..\..\..\staging\binaries, ..\..\..\staging\disks -DestinationPath ..\..\..\imsai-8080-emulator-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: imsai-8080-emulator-${{ matrix.target }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip