name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            strip: strip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            strip: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            strip: strip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs '"ADD_CMAKE_TO_PATH=System"'

      - name: Build CLI
        run: cargo build --release --bin imsai-cli --target ${{ matrix.target }}

      - name: Build GUI
        run: cargo build --release --bin imsai-gui --features gui --target ${{ matrix.target }}

      - name: Strip binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/imsai-cli
          strip target/${{ matrix.target }}/release/imsai-gui

      - name: Package binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../imsai-cli-${{ matrix.target }}.tar.gz imsai-cli
          tar czf ../../../imsai-gui-${{ matrix.target }}.tar.gz imsai-gui

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path imsai-cli.exe -DestinationPath ..\..\..\imsai-cli-${{ matrix.target }}.zip
          Compress-Archive -Path imsai-gui.exe -DestinationPath ..\..\..\imsai-gui-${{ matrix.target }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            imsai-cli-${{ matrix.target }}.*
            imsai-gui-${{ matrix.target }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip